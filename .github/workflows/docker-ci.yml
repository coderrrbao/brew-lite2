name: BrewLite Docker CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/brewlite-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/brewlite-web

jobs:
  docker-build-and-test:
    name: Build & Test Docker Stack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build Image API (NestJS)
      - name: Build API Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          load: true
          tags: ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # 2. Build Image Web (Next.js)
      - name: Build Web Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          load: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000
          tags: ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # 3. Khởi chạy Docker Compose & Verify Healthcheck
      - name: Start Compose & Verify Health
        env:
          API_IMAGE: ${{ env.API_IMAGE }}
          WEB_IMAGE: ${{ env.WEB_IMAGE }}
          IMAGE_TAG: latest
          JWT_SECRET: ci-test-secret-key
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
        run: |
          # Bật toàn bộ stack (api sẽ tự động chờ DB, tự migrate & seed qua entrypoint)
          docker compose up -d --wait --wait-timeout 60

          # Trạng thái các container
          docker compose ps

          # Verify HTTP Endpoints
          curl -f http://localhost:4000/health
          curl -f http://localhost:3000

      # 4. Push Image lên GHCR (Chỉ chạy trên nhánh main sau khi test pass)
      - name: Push Images to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.API_IMAGE }}:latest
          docker push ${{ env.WEB_IMAGE }}:latest

      # 5. In Log nếu có bước bị thất bại
      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      # 6. Dọn dẹp tài nguyên
      - name: Clean up containers
        if: always()
        run: docker compose down -v