name: BrewLite CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: BrewLite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Generate Prisma client
        working-directory: apps/api
        run: npm run db:generate

      - name: Push DB Schema
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/BrewLite_test?schema=public"
        run: npx prisma db push

      - name: Seed Database
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/BrewLite_test?schema=public"
        run: npm run db:seed

      - name: Lint
        working-directory: apps/api
        run: npm run lint

      - name: Unit & Integration tests
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/BrewLite_test?schema=public"
        run: npm test

      - name: Build
        working-directory: apps/api
        run: npm run build

  frontend:
    name: Frontend quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Type check & Lint
        working-directory: apps/web
        run: npm run lint

      - name: Build
        working-directory: apps/web
        run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: BrewLite_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/BrewLite_e2e?schema=public"
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: ci-jwt-secret
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Prepare database
        working-directory: apps/api
        run: |
          npm run db:generate
          npx prisma db push
          npm run db:seed

      - name: Build API & Web
        run: |
          npm run build:api
          npm run build:web

      - name: Start API & Web
        run: |
          (cd apps/api && node dist/main.js > ../../api.log 2>&1 &)
          (cd apps/web && npx next start -p 3000 > ../../web.log 2>&1 &)
          npx --yes wait-on -t 60000 http://localhost:4000/health http://localhost:3000

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            api.log
            web.log
          retention-days: 7
