name: CD

on:
  push:
    branches: ['main']
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      seed_database:
        description: 'Chạy prisma db seed trên production (CẢNH BÁO: seed XOÁ toàn bộ dữ liệu cũ)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # 1. Quality gate: lint, test, build, integration, E2E (tái sử dụng CI)
  quality:
    uses: ./.github/workflows/ci.yml

  # 2. Build image API, tag theo commit SHA (+ semver nếu push tag), push GHCR
  image:
    name: Build & push API image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.vars.outputs.api_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute tags
        id: vars
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHA_TAG="sha-${GITHUB_SHA::7}"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "api_image=ghcr.io/$OWNER/brewlite-backend:$SHA_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "extra=ghcr.io/$OWNER/brewlite-backend:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "extra=ghcr.io/$OWNER/brewlite-backend:latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ steps.vars.outputs.api_image }}
            ${{ steps.vars.outputs.extra }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # 3. Deploy: migrate -> API (Render) -> Web (Vercel) -> smoke test
  deploy:
    name: Deploy to production
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Forward-only, idempotent. Dockerfile API cũng chạy migrate deploy khi khởi động.
      - name: Prisma migrate deploy (Supabase)
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          npm install --no-audit --no-fund
          npx prisma generate
          npx prisma migrate deploy

      # Seed xoá toàn bộ dữ liệu -> chỉ chạy khi bấm tay và tick seed_database
      - name: Seed database (thủ công)
        if: ${{ inputs.seed_database == true }}
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: npx prisma db seed

      - name: Deploy API (Render)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMG: ${{ needs.image.outputs.api_image }}
          USE_IMAGE: ${{ vars.RENDER_USE_IMAGE }}
        run: |
          if [ "$USE_IMAGE" = "true" ]; then
            curl -fsS -G "$HOOK" --data-urlencode "imgURL=$IMG" > /dev/null
          else
            curl -fsS -X POST "$HOOK" > /dev/null
          fi

      - name: Deploy Web (Vercel)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/web
          vercel-args: '--prod'

      - name: Smoke test
        env:
          API_URL: ${{ secrets.RENDER_BACKEND_URL }}
          WEB_URL: ${{ secrets.VERCEL_FRONTEND_URL }}
        run: |
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS "$API_URL/health" > /dev/null; then ok=1; break; fi
            echo "Chờ API sẵn sàng ($i/30)..."; sleep 10
          done
          [ "$ok" = "1" ] || { echo "::error::API /health thất bại"; exit 1; }
          curl -fsS "$API_URL/products" > /dev/null
          curl -fsS "$WEB_URL" > /dev/null
          echo "Smoke test OK"

      - name: Hướng dẫn rollback
        if: failure()
        run: |
          echo "::error::Deploy thất bại. API: chạy workflow 'Rollback API' với tag/commit ổn định gần nhất."
          echo "Web: Vercel -> Deployments -> Instant Rollback. Chi tiết: docs/deployment.md"
